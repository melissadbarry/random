<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>São Paulo Guide</title>
<style>
  :root {
    --green: #009c3b;
    --green-deep: #006b29;
    --yellow: #ffdf00;
    --blue: #002776;
    --coral: #ff5a4f;
    --bg: #fffaf0;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6475;
    --line: #e8e0cc;
    --shadow: 0 2px 0 rgba(20,33,61,.08), 0 8px 24px rgba(20,33,61,.08);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1226; --surface: #131c38; --ink: #f4f1e6; --muted: #a6b0c8; --line: #25305a;
      --green: #2fd36b; --green-deep: #2fd36b; --blue: #7aa2ff;
      --shadow: 0 2px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1226; --surface: #131c38; --ink: #f4f1e6; --muted: #a6b0c8; --line: #25305a;
    --green: #2fd36b; --green-deep: #2fd36b; --blue: #7aa2ff;
    --shadow: 0 2px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  header.top {
    background: var(--green); color: #fff; position: sticky; top: 0; z-index: 10;
    border-bottom: 5px solid var(--yellow);
  }
  header.top .wrap { padding-top: 12px; padding-bottom: 12px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .brand .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; }
  .brand .dot::after { content: ""; width: 18px; height: 18px; background: var(--blue); border-radius: 50%; }
  .spacer { flex: 1; }
  .icon-btn { background: rgba(255,255,255,.18); border: 0; color: #fff; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; font-size: 18px; }
  .icon-btn:hover { background: rgba(255,255,255,.3); }

  /* Search */
  .search { position: relative; margin: 18px 0 8px; }
  .search input {
    width: 100%; padding: 16px 16px 16px 48px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--surface); font-size: 17px; box-shadow: var(--shadow);
  }
  .search input:focus { border-color: var(--blue); outline: none; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }

  /* Breadcrumb / back */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 18px 0 6px; color: var(--muted); font-size: 15px; }
  .crumbs button { background: none; border: 0; padding: 8px 4px; cursor: pointer; color: var(--blue); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
  .crumbs .here { color: var(--ink); font-weight: 700; }

  h1 { font-size: 28px; line-height: 1.15; margin: 14px 0 4px; letter-spacing: -.02em; }
  .lead { color: var(--muted); margin: 0 0 18px; }

  /* Tiles */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile {
    text-align: left; cursor: pointer; border: 0; border-radius: var(--radius); padding: 16px;
    min-height: 124px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    background: var(--tint, var(--green)); color: var(--on, #fff); box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .tile:hover { transform: translateY(-3px); }
  .tile:active { transform: translateY(0) scale(.98); }
  .tile .emoji { font-size: 30px; line-height: 1; }
  .tile .name { font-weight: 800; font-size: 18px; line-height: 1.15; }
  .tile .count { font-size: 13px; opacity: .9; font-weight: 600; }
  .tile.empty { opacity: .72; }

  /* Place cards */
  .list { display: grid; gap: 14px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
  .card .stripe { height: 6px; background: linear-gradient(90deg, var(--green) 0 50%, var(--yellow) 50% 75%, var(--blue) 75%); }
  .card .body { padding: 16px; }
  .card .head { display: flex; gap: 14px; align-items: center; }
  .logo { flex: none; width: 60px; height: 60px; border-radius: 14px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; overflow: hidden; border: 1px solid var(--line); }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .card h2 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -.01em; }
  .card .kind { color: var(--muted); font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .badge { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #eef2f7; color: var(--ink); }
  .badge.free { background: var(--green); color: #fff; }
  .badge.paid { background: var(--yellow); color: #3a3000; }
  .badge.walk { background: #dfe9ff; color: var(--blue); }
  .badge.pride { background: linear-gradient(90deg,#ff5a4f,#ffb000,#2fb36b,#3a7bff,#9b5bff); color: #fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge { background: #25305a; }
    :root:not([data-theme="light"]) .badge.walk { background: #25305a; color: #a9c1ff; }
  }
  dl.facts { margin: 12px 0 0; display: grid; gap: 10px; }
  dl.facts div { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
  dl.facts dt { font-size: 18px; }
  dl.facts dt span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  dl.facts dd { margin: 0; }
  .todo { color: var(--muted); font-style: italic; }
  .note { margin: 12px 0 0; padding: 12px 14px; background: color-mix(in srgb, var(--yellow) 22%, var(--surface)); border-radius: 12px; font-size: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; min-height: 48px; border-radius: 14px; font-weight: 700; text-decoration: none; border: 2px solid var(--line); background: var(--surface); }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); flex: 1 1 100%; justify-content: center; font-size: 17px; }
  @media (min-width: 520px) { .btn.primary { flex: 0 0 auto; } }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--yellow); color: #1a1a00; border-color: var(--yellow); } }
  :root[data-theme="dark"] .btn.primary { background: var(--yellow); color: #1a1a00; border-color: var(--yellow); }

  .empty-state { text-align: center; padding: 36px 20px; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
  .empty-state strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

  /* Filter chips */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  .chip { border: 2px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Emergency */
  .sos { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; border: 0; border-radius: var(--radius); padding: 16px; margin: 0 0 14px; background: #d93025; color: #fff; box-shadow: var(--shadow); }
  .sos:hover { filter: brightness(1.08); }
  .sos .big { font-size: 34px; line-height: 1; }
  .sos .t { font-weight: 800; font-size: 19px; line-height: 1.2; }
  .sos .s { font-size: 14px; opacity: .95; }
  .sos-main { display: grid; gap: 12px; margin-bottom: 22px; }
  .sos-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 16px; border-radius: var(--radius); background: var(--c); color: #fff; text-decoration: none; box-shadow: var(--shadow); }
  .sos-card .n { font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .sos-card .w { font-weight: 800; font-size: 19px; line-height: 1.2; }
  .sos-card .u { grid-column: 1 / -1; font-size: 15px; opacity: .95; }
  h2.sec { font-size: 20px; margin: 22px 0 10px; }
  .num-list { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .num-list li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .num-list .n { font-size: 28px; font-weight: 900; color: var(--blue); font-variant-numeric: tabular-nums; }
  .num-list .w { font-weight: 700; }
  .num-list .u { color: var(--muted); font-size: 15px; }
  .contact-line { font-variant-numeric: tabular-nums; }

  .foot { margin-top: 36px; color: var(--muted); font-size: 14px; text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="São Paulo Guide, home"><span class="dot" aria-hidden="true"></span>São Paulo Guide</a>
    <span class="spacer"></span>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Light / dark">◐</button>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ==========================================================================
   YOUR DATA. To add a place, copy one entry in PLACES and fill it in.
   cat / sub must match ids in CATEGORIES below.
   price.type: "free" | "paid" | "varies"   (price.detail = "R$ 150 to 300", etc.)
   Leave a field out (or "") and the card shows "Not added yet".
   logo: URL or path of an image. If empty, a colored initial is shown.
   maps: optional exact Google Maps link. If empty, one is built from name + address.
   ========================================================================== */
const CATEGORIES = [
  { id: "medical", name: "Medical", emoji: "🩺", tint: "#009c3b", on: "#ffffff",
    blurb: "What do you need to get checked?",
    subs: [
      { id: "general",   name: "General consult",  emoji: "👩‍⚕️" },
      { id: "eyes",      name: "Eyes",             emoji: "👁️" },
      { id: "teeth",     name: "Teeth",            emoji: "🦷" },
      { id: "sexual",    name: "Sexual health",    emoji: "🌈" },
      { id: "womens",    name: "Women's health",   emoji: "🌸" },
      { id: "mental",    name: "Mental health",    emoji: "🧠" },
      { id: "labs",      name: "Labs & pharmacy",  emoji: "🧪" },
      { id: "emergency", name: "Hospitals & ER",   emoji: "🏥" }
    ] },
  { id: "admin", name: "Administrative", emoji: "📄", tint: "#002776", on: "#ffffff",
    blurb: "Papers, permits and paperwork.",
    subs: [
      { id: "ids",     name: "IDs & documents",     emoji: "🪪" },
      { id: "visa",    name: "Visa & immigration",  emoji: "🛂" },
      { id: "tax",     name: "Taxes & CPF",         emoji: "🧾" },
      { id: "bank",    name: "Banking & money",     emoji: "🏦" },
      { id: "phone",   name: "SIM, phone & internet", emoji: "📱" },
      { id: "transport", name: "Transport card",    emoji: "🚇" }
    ] },
  { id: "go-to", name: "My go-to places", emoji: "⭐", tint: "#ffdf00", on: "#2b2500",
    blurb: "The spots I always come back to.",
    subs: [
      { id: "food",     name: "Food & coffee",     emoji: "☕" },
      { id: "groceries", name: "Groceries",        emoji: "🛒" },
      { id: "movement", name: "Movement & wellness", emoji: "🧘" },
      { id: "work",     name: "Work spots",        emoji: "💻" },
      { id: "social",   name: "Going out",         emoji: "💃" }
    ] }
];

/* Emergency numbers: free, work from any phone, no area code needed. */
const EMERGENCY = {
  main: [
    { num: "192", name: "Ambulance (SAMU)", use: "Medical emergency: collapse, accident, heavy bleeding, chest pain.", emoji: "🚑", color: "#d93025" },
    { num: "190", name: "Police (Polícia Militar)", use: "Crime in progress, danger, theft, violence.", emoji: "🚓", color: "#002776" },
    { num: "193", name: "Fire brigade (Bombeiros)", use: "Fire, rescue, gas leak, drowning, trapped in a lift.", emoji: "🚒", color: "#c2410c" }
  ],
  more: [
    { num: "180", name: "Women's helpline", use: "Violence against women. Free, confidential, 24/7." },
    { num: "188", name: "Emotional support (CVV)", use: "Anxiety, crisis, suicidal thoughts. Free, confidential, 24/7." },
    { num: "197", name: "Civil Police (report by phone)", use: "Report a crime or get information on police reports." },
    { num: "153", name: "Municipal guard (Guarda Civil)", use: "City guard, public spaces and municipal property." },
    { num: "199", name: "Civil Defence (Defesa Civil)", use: "Floods, landslides, storm damage." },
    { num: "100", name: "Human rights helpline", use: "Report rights violations, abuse, discrimination." },
    { num: "191", name: "Federal highway police", use: "Accidents on federal highways." },
    { num: "194", name: "Federal Police", use: "Federal crimes, immigration and border matters." },
    { num: "136", name: "Health ministry (Disque Saúde)", use: "Health information and guidance." }
  ],
  tip: "Say “Preciso de ajuda” (I need help) and the street address. Save these numbers in your phone."
};

const PLACES = [
  {
    id: "ahf-brasil",
    name: "AHF Brasil",
    cat: "medical", sub: "sexual",
    kind: "Community sexual health clinic",
    logo: "",
    address: "Rua Pedro Américo, 52, República, São Paulo, 01045-010",
    area: "Right next to República metro station",
    hours: "Monday to Friday, 11:30 to 18:30 (closed on holidays)",
    price: { type: "free", detail: "Everything is free: STI testing, counselling and doctor consults." },
    walkIn: true,
    tags: ["STI testing", "counselling", "doctor", "LGBTQ+ friendly", "free", "no appointment", "sexual health", "HIV", "syphilis", "hepatitis", "teste"],
    pride: true,
    instagram: "https://www.instagram.com/ahf.brasil",
    website: "https://ahfbrasil.com.br",
    phone: "+55 11 3352-7760",
    whatsapp: "+55 11 91371-6729",
    maps: "",
    note: "No appointment needed, just show up. LGBTQ+ friendly and respectful, and the staff are LGBTQ+ themselves. Great for STI testing, counselling or seeing a doctor specialised in sexual diseases."
  }
];

/* ==========================================================================
   App code. You should not need to touch anything below this line.
   ========================================================================== */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const cat = id => CATEGORIES.find(c => c.id === id);
const sub = (c, id) => c && c.subs.find(s => s.id === id);
const placesIn = (c, s) => PLACES.filter(p => p.cat === c && (!s || p.sub === s));
const plural = n => n === 1 ? "1 place" : n + " places";

function mapsUrl(p) {
  if (p.maps) return p.maps;
  const q = [p.name, p.address || p.area, "São Paulo"].filter(Boolean).join(", ");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
const field = (v, fallback = "Not added yet") => v ? esc(v) : `<span class="todo">${fallback}</span>`;

function priceBadge(p) {
  const t = p.price?.type;
  if (t === "free") return `<span class="badge free">Free</span>`;
  if (t === "paid") return `<span class="badge paid">${esc(p.price.amount || "Paid")}</span>`;
  if (t === "varies") return `<span class="badge paid">Price varies</span>`;
  return `<span class="badge">Price unknown</span>`;
}

function card(p) {
  const c = cat(p.cat), s = sub(c, p.sub);
  const initial = esc((p.name || "?").trim()[0].toUpperCase());
  const logo = p.logo
    ? `<img src="${esc(p.logo)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${initial}'">`
    : initial;
  const links = [
    `<a class="btn primary" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">📍 Directions in Google Maps</a>`,
    p.phone ? `<a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">📞 Call</a>` : "",
    p.whatsapp ? `<a class="btn" href="https://wa.me/${esc(p.whatsapp.replace(/\D/g, ""))}" target="_blank" rel="noopener">💬 WhatsApp</a>` : "",
    p.instagram ? `<a class="btn" href="${esc(p.instagram)}" target="_blank" rel="noopener">📷 Instagram</a>` : "",
    p.website ? `<a class="btn" href="${esc(p.website)}" target="_blank" rel="noopener">🌐 Website</a>` : ""
  ].join("");
  return `
  <article class="card">
    <div class="stripe"></div>
    <div class="body">
      <div class="head">
        <div class="logo">${logo}</div>
        <div>
          <h2>${esc(p.name)}</h2>
          <div class="kind">${esc(p.kind || (s ? s.name : ""))}</div>
        </div>
      </div>
      <div class="badges">
        ${priceBadge(p)}
        ${p.walkIn ? `<span class="badge walk">Walk-in, no booking</span>` : ""}
        ${p.pride ? `<span class="badge pride">LGBTQ+ friendly</span>` : ""}
      </div>
      <dl class="facts">
        <div><dt aria-hidden="true">📍</dt><dd><span class="sr">Address: </span>${field(p.address)}${p.area ? `<br><small>${esc(p.area)}</small>` : ""}</dd></div>
        <div><dt aria-hidden="true">🕒</dt><dd><span class="sr">Opening hours: </span>${field(p.hours)}</dd></div>
        <div><dt aria-hidden="true">💶</dt><dd><span class="sr">Cost: </span>${p.price?.detail ? esc(p.price.detail) : `<span class="todo">Not added yet</span>`}</dd></div>
        ${p.phone || p.whatsapp ? `<div><dt aria-hidden="true">📞</dt><dd class="contact-line">${p.phone ? `Phone ${esc(p.phone)}` : ""}${p.phone && p.whatsapp ? "<br>" : ""}${p.whatsapp ? `WhatsApp ${esc(p.whatsapp)}` : ""}</dd></div>` : ""}
      </dl>
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      <div class="actions">${links}</div>
    </div>
  </article>`;
}

function crumbs(parts) {
  return `<nav class="crumbs" aria-label="Breadcrumb">` + parts.map((x, i) =>
    i === parts.length - 1 ? `<span class="here" aria-current="page">${esc(x.label)}</span>`
    : `<button onclick="go('${x.to}')">${esc(x.label)}</button><span aria-hidden="true">›</span>`).join("") + `</nav>`;
}

function searchBox(value = "") {
  return `<div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="sr" for="q">Search the guide</label>
    <input id="q" type="search" placeholder="Search anything: dentist, visa, STI test…" value="${esc(value)}" autocomplete="off">
  </div>`;
}

function viewHome() {
  $app.innerHTML = `
    ${searchBox()}
    <button class="sos" onclick="go('/emergency')">
      <span class="big" aria-hidden="true">🆘</span>
      <span><span class="t">Emergency numbers</span><br><span class="s">Ambulance 192 · Police 190 · Fire 193</span></span>
    </button>
    <h1>Olá! What do you need?</h1>
    <p class="lead">Tap a topic. Two taps and you have your answer.</p>
    <div class="grid">
      ${CATEGORIES.map(c => {
        const n = placesIn(c.id).length;
        return `<button class="tile ${n ? "" : "empty"}" style="--tint:${c.tint};--on:${c.on}" onclick="go('/${c.id}')">
          <span class="emoji" aria-hidden="true">${c.emoji}</span>
          <span><span class="name">${esc(c.name)}</span><br><span class="count">${n ? plural(n) : "Nothing yet"}</span></span>
        </button>`; }).join("")}
    </div>
    <p class="foot">Built little by little ✨ · ${plural(PLACES.length)} saved</p>`;
  bindSearch();
}

function viewEmergency() {
  $app.innerHTML = `
    ${crumbs([{ label: "Home", to: "/" }, { label: "Emergency numbers" }])}
    <h1>🆘 Emergency numbers</h1>
    <p class="lead">All free, 24/7, from any phone, even without credit. No area code needed.</p>
    <div class="sos-main">
      ${EMERGENCY.main.map(e => `<a class="sos-card" style="--c:${e.color}" href="tel:${e.num}" aria-label="${esc(e.name)}, ${e.num}">
        <span class="n">${e.num}</span><span class="w">${e.emoji} ${esc(e.name)}</span>
        <span class="u">${esc(e.use)}</span></a>`).join("")}
    </div>
    <p class="note">${esc(EMERGENCY.tip)}</p>
    <h2 class="sec">Other useful numbers</h2>
    <ul class="num-list">
      ${EMERGENCY.more.map(e => `<li><span class="n">${e.num}</span><span><span class="w">${esc(e.name)}</span><br><span class="u">${esc(e.use)}</span></span></li>`).join("")}
    </ul>
    <p class="foot">Always double check with official sources if something feels off.</p>`;
}

function viewCategory(c) {
  $app.innerHTML = `
    ${crumbs([{ label: "Home", to: "/" }, { label: c.name }])}
    <h1>${c.emoji} ${esc(c.name)}</h1>
    <p class="lead">${esc(c.blurb)}</p>
    <div class="grid">
      ${c.subs.map(s => {
        const n = placesIn(c.id, s.id).length;
        return `<button class="tile ${n ? "" : "empty"}" style="--tint:${c.tint};--on:${c.on}" onclick="go('/${c.id}/${s.id}')">
          <span class="emoji" aria-hidden="true">${s.emoji}</span>
          <span><span class="name">${esc(s.name)}</span><br><span class="count">${n ? plural(n) : "Nothing yet"}</span></span>
        </button>`; }).join("")}
    </div>`;
}

let priceFilter = "all";
function viewSub(c, s) {
  const all = placesIn(c.id, s.id);
  const shown = all.filter(p => priceFilter === "all" || p.price?.type === priceFilter);
  $app.innerHTML = `
    ${crumbs([{ label: "Home", to: "/" }, { label: c.name, to: "/" + c.id }, { label: s.name }])}
    <h1>${s.emoji} ${esc(s.name)}</h1>
    ${all.length > 1 ? `<div class="chips" role="group" aria-label="Filter by price">
      ${["all","free","paid"].map(f => `<button class="chip" aria-pressed="${priceFilter === f}" onclick="setPrice('${f}')">${{all:"All",free:"Free only",paid:"Paid"}[f]}</button>`).join("")}
    </div>` : `<p class="lead">${all.length ? "" : "Tell me a place and I will add it here."}</p>`}
    <div class="list">
      ${shown.length ? shown.map(card).join("") : `<div class="empty-state"><strong>Nothing here yet</strong>Send me a place for ${esc(s.name)} and it will show up here.</div>`}
    </div>`;
}
window.setPrice = f => { priceFilter = f; route(); };

function viewSearch(q) {
  const t = q.toLowerCase().trim();
  const hits = PLACES.filter(p => {
    const c = cat(p.cat), s = sub(c, p.sub);
    return [p.name, p.kind, p.address, p.area, p.note, c?.name, s?.name, ...(p.tags || [])].join(" ").toLowerCase().includes(t);
  });
  const catHits = CATEGORIES.flatMap(c => c.subs.filter(s => (s.name + " " + c.name).toLowerCase().includes(t)).map(s => ({ c, s })));
  $app.innerHTML = `
    ${searchBox(q)}
    ${catHits.length ? `<h1>Jump to</h1><div class="chips">${catHits.map(({c,s}) => `<button class="chip" onclick="go('/${c.id}/${s.id}')">${s.emoji} ${esc(s.name)}</button>`).join("")}</div>` : ""}
    <h1>${hits.length ? plural(hits.length) : "No results"}</h1>
    <div class="list">${hits.map(card).join("") || `<div class="empty-state"><strong>Nothing found for “${esc(q)}”</strong>Try another word, or send me the place to add.</div>`}</div>`;
  bindSearch(true);
}

function bindSearch(keepFocus) {
  const el = document.getElementById("q");
  if (!el) return;
  el.addEventListener("input", () => {
    const v = el.value;
    if (v.trim()) { viewSearch(v); } else { viewHome(); }
  });
  if (keepFocus) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function go(path) { location.hash = "#" + path; }
window.go = go;

function route() {
  const [, cId, sId] = (location.hash.slice(1) || "/").split("/");
  const c = cat(cId), s = sub(c, sId);
  if (cId === "emergency") viewEmergency();
  else if (c && s) viewSub(c, s);
  else if (c) viewCategory(c);
  else viewHome();
  if (!document.activeElement || document.activeElement === document.body) window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", () => { priceFilter = "all"; route(); window.scrollTo({ top: 0 }); });
route();

/* Theme toggle (remembered if the browser allows it) */
const root = document.documentElement;
try { const t = localStorage.getItem("sp-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("sp-theme", root.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
