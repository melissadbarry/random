<style>
  /* Layout: calm, scannable single column with a wide editorial hero. Rows for fast scanning, one strong wine accent.
     Palette: mist (Virgo order), aubergine ink + wine (Venus in Scorpio), jungle green + sun yellow (Brazil, used sparingly). */
  :root {
    --bg: #fcfaf7;
    --surface: #ffffff;
    --raise: #ffffff;
    --ink: #2a2230;
    --muted: #6f6676;
    --line: #eee9e2;
    --wine: #a8305a;
    --wine-soft: #fbeaf1;
    --on-wine: #ffffff;
    --green: #17795a;
    --green-soft: #e3f4ec;
    --sun: #f6c90e;
    --sun-soft: #fef5d2;
    --sos: #a8305a;
    --on-sos: #ffffff;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --radius: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; line-height: 1.6; background: var(--bg); color: var(--ink);
    font: 17px/1.55 var(--font-body); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid var(--wine); outline-offset: 3px; border-radius: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 820px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

  /* Top bar */
  .bar { display: flex; align-items: center; gap: 10px; padding-block: 18px 6px; }
  .mark { display: flex; align-items: baseline; gap: 8px; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
  .mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); display: inline-block; transform: translateY(-1px); }
  .mark span { font-weight: 500; color: var(--muted); font-size: 15px; letter-spacing: 0; }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none; font-weight: 700; font-size: 15px; background: var(--sos); color: var(--on-sos); }
  .pill:hover { opacity: .88; }
  .pill small { font-weight: 600; opacity: .8; font-size: 13px; }
  @media (max-width: 440px) { .pill small { display: none; } .mark span { display: none; } }
  .ghost { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
  .ghost:hover { border-color: var(--ink); }

  /* Hero + search */
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--wine); margin: 34px 0 10px; }
  h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; font-size: clamp(36px, 8vw, 60px); margin: 0 0 14px; text-wrap: balance; }
  h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--sun) 62% 92%, transparent 92%); }
  .lead { color: var(--muted); max-width: 52ch; margin: 0 0 28px; font-size: 18px; }
  .search { position: relative; margin-bottom: 26px; }
  .search input { width: 100%; height: 62px; box-shadow: 0 6px 22px rgba(120,60,90,.07); padding: 0 18px 0 54px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--raise); font-size: 18px; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 4px var(--wine-soft); }
  .search svg { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 22px; height: 22px; }

  /* Home panels */
  .panels { display: grid; gap: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 20px; }
  .panel-head { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
  .badge-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--c-soft); color: var(--c); flex: none; }
  .badge-ico svg { width: 26px; height: 26px; }
  .panel-head .t { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.02em; line-height: 1.1; display: block; }
  .panel-head .s { color: var(--muted); font-size: 15px; display: block; }
  .panel-head .go { margin-left: auto; color: var(--muted); }
  .panel-head:hover .go { color: var(--ink); transform: translateX(3px); }
  .go { transition: transform .15s; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; }
  .qk { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font-weight: 600; font-size: 15px; }
  .qk svg { color: var(--c); width: 1.1em; height: 1.1em; }
  .qk:hover { border-color: var(--c); background: var(--c-soft); }
  .qk b { font-weight: 700; color: var(--muted); font-size: 13px; }
  .c-medical { --c: var(--wine); --c-soft: var(--wine-soft); }
  .c-admin { --c: var(--green); --c-soft: var(--green-soft); }
  .c-goto { --c: #8a6a00; --c-soft: var(--sun-soft); }

  /* Back + titles */
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 22px; padding: 0 14px 0 8px; border: 0; background: none; cursor: pointer; font-weight: 700; color: var(--wine); font-size: 16px; border-radius: 999px; }
  .back:hover { background: var(--wine-soft); }
  .page-title { display: flex; align-items: center; gap: 14px; margin: 8px 0 6px; }
  .page-title h1 { font-size: clamp(32px, 7vw, 46px); margin: 0; }
  .page-title .badge-ico { width: 58px; height: 58px; }

  /* Sub rows */
  .rows { display: grid; gap: 12px; margin-top: 24px; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; min-height: 68px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .row:hover { border-color: var(--c); background: var(--raise); }
  .row .badge-ico { width: 42px; height: 42px; border-radius: 13px; }
  .row .badge-ico svg { width: 22px; height: 22px; }
  .row .n { font-weight: 700; font-size: 18px; }
  .row .ct { margin-left: auto; color: var(--muted); font-size: 14px; font-weight: 600; }
  .row.none { opacity: .62; }

  /* Place cards */
  .list { display: grid; gap: 22px; margin-top: 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; box-shadow: 0 10px 30px rgba(120,60,90,.06); }
  .card-top { display: flex; align-items: center; gap: 14px; }
  .logo { flex: none; width: 58px; height: 58px; border-radius: 16px; background: var(--wine); color: var(--on-wine); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .card h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
  .kind { color: var(--muted); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
  .tag { font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--line); color: var(--ink); }
  .tag.free { background: var(--green); color: #fff; }
  .tag.paid { background: var(--sun); color: #2b2200; }
  .tag.soft { background: var(--wine-soft); color: var(--wine); }
  dl.facts { display: grid; gap: 0; margin: 14px 0 0; }
  dl.facts > div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
  dl.facts dt { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  dd small { color: var(--muted); font-size: 15px; }
  .todo { color: var(--muted); font-style: italic; }
  .num { font-variant-numeric: tabular-nums; }
  .note { margin: 14px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--sun-soft); font-size: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 700; font-size: 16px; text-decoration: none; border: 1.5px solid var(--line); background: var(--raise); }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { flex: 1 1 100%; background: var(--wine); color: var(--on-wine); border-color: var(--wine); font-size: 17px; min-height: 52px; }
  .btn.primary:hover { opacity: .9; }
  .empty-state { padding: 34px 22px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
  .empty-state strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 20px; margin-bottom: 4px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Emergency */
  .sos-main { display: grid; gap: 12px; margin: 20px 0; }
  .sos-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; align-items: center; padding: 20px; border-radius: var(--radius); background: var(--c); color: #fff; text-decoration: none; }
  .sos-card .n { font-family: var(--font-display); font-size: 68px; font-weight: 800; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; grid-row: span 2; }
  .sos-card .w { font-weight: 800; font-size: 20px; line-height: 1.2; align-self: end; }
  .sos-card .u { font-size: 15px; opacity: .92; align-self: start; }
  h2.sec { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; margin: 34px 0 12px; }
  .num-list { display: grid; gap: 0; padding: 0; margin: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .num-list li { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
  .num-list li:first-child { border-top: 0; }
  .num-list .n { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--wine); font-variant-numeric: tabular-nums; }
  .num-list .w { font-weight: 700; }
  .num-list .u { color: var(--muted); font-size: 15px; }

  .foot { margin: 40px 0 0; color: var(--muted); font-size: 14px; }
  main.wrap { padding-bottom: 96px; }
  @media (min-width: 700px) {
    .panels { grid-template-columns: 1fr 1fr; }
    .panel.wide { grid-column: 1 / -1; }
    .sos-main { grid-template-columns: repeat(3, 1fr); }
    .sos-card { grid-template-columns: 1fr; }
    .sos-card .n { grid-row: auto; font-size: 76px; }
    .actions .btn.primary { flex: 0 0 auto; }
  }
  @media (max-width: 420px) { dl.facts > div { grid-template-columns: 1fr; gap: 2px; } }
  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>

    maps: "",
    note: "No appointment needed, just show up. LGBTQ+ friendly and respectful, and the staff are LGBTQ+ themselves. Great for STI testing, counselling or seeing a doctor specialised in sexual diseases."
  }
];

/* ==========================================================================
   App code. You should not need to touch anything below this line.
   ========================================================================== */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const cat = id => CATEGORIES.find(c => c.id === id);
const sub = (c, id) => c && c.subs.find(s => s.id === id);
const placesIn = (c, s) => PLACES.filter(p => p.cat === c && (!s || p.sub === s));
const count = n => n === 1 ? "1 place" : n + " places";

function mapsUrl(p) {
  if (p.maps) return p.maps;
  const q = [p.name, p.address || p.area, "São Paulo"].filter(Boolean).join(", ");
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
const field = (v) => v ? esc(v) : `<span class="todo">Not added yet</span>`;

function priceTag(p) {
  const t = p.price?.type;
  if (t === "free") return `<span class="tag free">Free</span>`;
  if (t === "paid") return `<span class="tag paid">${esc(p.price.amount || "Paid")}</span>`;
  if (t === "varies") return `<span class="tag paid">Price varies</span>`;
  return `<span class="tag">Price unknown</span>`;
}

function card(p) {
  const initial = esc((p.name || "?").trim()[0].toUpperCase());
  const logo = p.logo ? `<img src="${esc(p.logo)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${initial}'">` : initial;
  const btn = (href, icon, label) => `<a class="btn" href="${esc(href)}" target="_blank" rel="noopener">${ico(icon)}${label}</a>`;
  return `
  <article class="card">
    <div class="card-top">
      <div class="logo">${logo}</div>
      <div><h2>${esc(p.name)}</h2><div class="kind">${esc(p.kind || "")}</div></div>
    </div>
    <div class="tags">
      ${priceTag(p)}
      ${p.walkIn ? `<span class="tag soft">Walk-in, no booking</span>` : ""}
      ${p.pride ? `<span class="tag soft">LGBTQ+ friendly</span>` : ""}
    </div>
    <dl class="facts">
      <div><dt>Address</dt><dd>${field(p.address)}${p.area ? `<br><small>${esc(p.area)}</small>` : ""}</dd></div>
      <div><dt>Hours</dt><dd>${field(p.hours)}</dd></div>
      <div><dt>Cost</dt><dd>${field(p.price?.detail)}</dd></div>
      ${p.phone || p.whatsapp ? `<div><dt>Contact</dt><dd class="num">${p.phone ? `Phone ${esc(p.phone)}` : ""}${p.phone && p.whatsapp ? "<br>" : ""}${p.whatsapp ? `WhatsApp ${esc(p.whatsapp)}` : ""}</dd></div>` : ""}
    </dl>
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
    <div class="actions">
      <a class="btn primary" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">${ico("pin")}Get directions</a>
      ${p.whatsapp ? btn("https://wa.me/" + p.whatsapp.replace(/\D/g, ""), "chat", "WhatsApp") : ""}
      ${p.phone ? `<a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">${ico("call")}Call</a>` : ""}
      ${p.instagram ? btn(p.instagram, "insta", "Instagram") : ""}
      ${p.website ? btn(p.website, "globe", "Website") : ""}
    </div>
  </article>`;
}

const back = (label, to) => `<button class="back" onclick="go('${to}')">${ico("back")}${esc(label)}</button>`;

function searchBox(value = "") {
  return `<div class="search" role="search">${ico("search")}
    <label class="sr" for="q">Search the guide</label>
    <input id="q" type="search" placeholder="Try “dentist”, “visa” or “STI test”" value="${esc(value)}" autocomplete="off"></div>`;
}

function viewHome() {
  $app.innerHTML = `
    <p class="kicker">Sampa, sorted</p>
    <h1>Whatever you need, <em>two taps</em> away.</h1>
    <p class="lead">Your day-to-day city guide. Pick a topic, or jump straight to what you need.</p>
    ${searchBox()}
    <div class="panels">
      ${CATEGORIES.map((c, i) => {
        const n = placesIn(c.id).length;
        return `<section class="panel ${c.cls} ${i === 0 ? "wide" : ""}">
          <button class="panel-head" onclick="go('/${c.id}')" aria-label="Open ${esc(c.name)}">
            <span class="badge-ico">${ico(c.icon)}</span>
            <span><span class="t">${esc(c.name)}</span><span class="s">${esc(c.blurb)}${n ? " · " + count(n) : ""}</span></span>
            <span class="go">${ico("next")}</span>
          </button>
          <div class="quick">${c.subs.map(s => `<button class="qk" onclick="go('/${c.id}/${s.id}')">${ico(s.icon)}${esc(s.name)}</button>`).join("")}</div>
        </section>`; }).join("")}
    </div>
    <p class="foot">${count(PLACES.length)} saved so far. More coming.</p>`;
  bindSearch();
}

function viewEmergency() {
  $app.innerHTML = `
    ${back("Home", "/")}
    <div class="page-title"><h1>Emergency numbers</h1></div>
    <p class="lead">All free, 24/7, from any phone, even without credit. No area code needed.</p>
    <div class="sos-main">
      ${EMERGENCY.main.map(e => `<a class="sos-card" style="--c:${e.color}" href="tel:${e.num}" aria-label="${esc(e.name)}, ${e.num}">
        <span class="n">${e.num}</span><span class="w">${esc(e.name)}</span><span class="u">${esc(e.use)}</span></a>`).join("")}
    </div>
    <p class="note">${esc(EMERGENCY.tip)}</p>
    <h2 class="sec">Other useful numbers</h2>
    <ul class="num-list">
      ${EMERGENCY.more.map(e => `<li><span class="n">${e.num}</span><span><span class="w">${esc(e.name)}</span><br><span class="u">${esc(e.use)}</span></span></li>`).join("")}
    </ul>
    <p class="foot">Double check with official sources if something feels off.</p>`;
}

function viewCategory(c) {
  $app.innerHTML = `
    ${back("Home", "/")}
    <div class="page-title ${c.cls}"><span class="badge-ico">${ico(c.icon)}</span><h1>${esc(c.name)}</h1></div>
    <p class="lead">${esc(c.blurb)}</p>
    <div class="rows ${c.cls}">
      ${c.subs.map(s => {
        const n = placesIn(c.id, s.id).length;
        return `<button class="row ${n ? "" : "none"}" onclick="go('/${c.id}/${s.id}')">
          <span class="badge-ico">${ico(s.icon)}</span><span class="n">${esc(s.name)}</span>
          <span class="ct">${n ? count(n) : "Nothing yet"}</span>${ico("next")}</button>`; }).join("")}
    </div>`;
}

let priceFilter = "all";
function viewSub(c, s) {
  const all = placesIn(c.id, s.id);
  const shown = all.filter(p => priceFilter === "all" || p.price?.type === priceFilter);
  $app.innerHTML = `
    ${back(c.name, "/" + c.id)}
    <div class="page-title ${c.cls}"><span class="badge-ico">${ico(s.icon)}</span><h1>${esc(s.name)}</h1></div>
    ${all.length > 1 ? `<div class="chips" role="group" aria-label="Filter by price">
      ${["all","free","paid"].map(f => `<button class="chip" aria-pressed="${priceFilter === f}" onclick="setPrice('${f}')">${{all:"All",free:"Free only",paid:"Paid"}[f]}</button>`).join("")}</div>` : ""}
    <div class="list">
      ${shown.length ? shown.map(card).join("") : `<div class="empty-state"><strong>Nothing here yet</strong>Send me a place for ${esc(s.name)} and it shows up here.</div>`}
    </div>`;
}
window.setPrice = f => { priceFilter = f; route(); };

function viewSearch(q) {
  const t = q.toLowerCase().trim();
  const hits = PLACES.filter(p => {
    const c = cat(p.cat), s = sub(c, p.sub);
    return [p.name, p.kind, p.address, p.area, p.note, c?.name, s?.name, ...(p.tags || [])].join(" ").toLowerCase().includes(t);
  });
  const jumps = CATEGORIES.flatMap(c => c.subs.filter(s => (s.name + " " + c.name).toLowerCase().includes(t)).map(s => ({ c, s })));
  $app.innerHTML = `
    <div style="height:22px"></div>
    ${searchBox(q)}
    ${jumps.length ? `<div class="quick" style="margin-bottom:22px">${jumps.map(({c,s}) => `<button class="qk ${c.cls}" onclick="go('/${c.id}/${s.id}')">${ico(s.icon)}${esc(s.name)}</button>`).join("")}</div>` : ""}
    <h2 class="sec" style="margin-top:0">${hits.length ? count(hits.length) : "No results"}</h2>
    <div class="list" style="margin-top:0">${hits.map(card).join("") || `<div class="empty-state"><strong>Nothing found for “${esc(q)}”</strong>Try another word, or send me the place to add.</div>`}</div>`;
  bindSearch(true);
}

function bindSearch(keepFocus) {
  const el = document.getElementById("q");
  if (!el) return;
  el.addEventListener("input", () => { const v = el.value; v.trim() ? viewSearch(v) : viewHome(); });
  if (keepFocus) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function go(path) { location.hash = "#" + path; }
window.go = go;

function route() {
  const [, cId, sId] = (location.hash.slice(1) || "/").split("/");
  const c = cat(cId), s = sub(c, sId);
  if (cId === "emergency") viewEmergency();
  else if (c && s) viewSub(c, s);
  else if (c) viewCategory(c);
  else viewHome();
}
window.addEventListener("hashchange", () => { priceFilter = "all"; route(); window.scrollTo({ top: 0 }); });
route();

</script>
</body>
</html>
